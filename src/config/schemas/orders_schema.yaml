files:
    - olist_orders_dataset.csv

columns:
    order_id:
        type: string
        nullable: false
    customer_id:
        type: string
        nullable: false
    order_status:
        type: string
        allowed_values:
            - delivered
            - invoiced
            - shipped
            - processing
            - unavailable
            - canceled
            - created
            - approved
        nullable: false
    order_purchase_timestamp:
        type: datetime
        nullable: false
    order_approved_at:
        type: datetime
        nullable: true
    order_delivered_carrier_date:
        type: datetime
        nullable: true
    order_delivered_customer_date:
        type: datetime
        nullable: true
    order_estimated_delivery_date:
        type: datetime
        nullable: false
